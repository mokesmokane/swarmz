[package]
name = "swarmz-tool"
version = "0.1.0"
edition = "2021"
description = "swarmz session holder and command-line tool"

[lib]
name = "swarmz_tool"
path = "src/lib.rs"

[[bin]]
name = "swarmz-tool"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"
vt100 = "0.16"
