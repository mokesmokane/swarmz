[workspace]
members = ["tool"]

[package]
name = "swarmz"
version = "0.3.0"
description = "Tiled terminal workbench for Claude Code agents"
authors = ["Martin O'Kane"]
edition = "2021"

[lib]
name = "swarmz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
swarmz-tool = { path = "tool" }
libc = "0.2"

# The updater and process plugins are desktop-only; gate them the way the Tauri docs do so a
# mobile target would still resolve.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
