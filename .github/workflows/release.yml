name: release

# Cutting a release is pushing a tag: `npm run version -- 0.2.0`, commit, `git tag v0.2.0`,
# `git push origin v0.2.0`. See docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same gate as every push. Nothing is signed or published until it passes.
  checks:
    uses: ./.github/workflows/checks.yml

  # Builds, signs, notarises and staples the macOS app, produces the updater artifacts, and
  # creates the DRAFT release the user writes notes on and publishes. Nothing reaches anyone's
  # updater until that publish happens: the endpoint reads `releases/latest/download/latest.json`,
  # and a draft is never "latest".
  macos:
    needs: checks
    # Forks have none of these secrets, and must never try to use them.
    if: github.repository == 'mokesmokane/swarmz'
    runs-on: macos-14
    permissions:
      contents: write
    outputs:
      releaseId: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v5

      # A tag that does not match the version would publish a release whose latest.json still
      # names the old one: nobody updates, and nothing errors. Node is preinstalled on the runner,
      # so this needs no setup and runs before anything expensive.
      - name: The tag must match the version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in src-tauri/tauri.conf.json ($VERSION). Run \`npm run version -- $TAG\`, commit, delete the tag and tag again."
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches version $VERSION"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # A keychain of our own, thrown away in the last step, so nothing is left on the runner and
      # the login keychain is never touched. Nothing here is echoed; do not add `set -x`.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # Kept in step with the cleanup step, which recomputes it rather than reading a variable
          # this step might never reach.
          KEYCHAIN_PATH="$RUNNER_TEMP/swarmz-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          # For `npm run build:tool`, which signs the holder binary before the bundler copies it
          # into the app. Exported first thing, so a later failure in this step cannot leave it
          # half set; the cleanup step does not read it.
          echo "APPLE_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Locks on sleep and after six hours rather than the default five minutes, which
          # signing plus notarisation can easily outlast.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      # Notarisation uses an App Store Connect API key: this account's Apple ID auth returns 401.
      # The bundler wants the key as a file named AuthKey_<id>.p8 (tauri-bundler 2.11's
      # notarize_auth). The secret holds the PEM text rather than base64, and the step below
      # normalises its trailing newline so the file is byte-identical to the downloaded .p8.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_PEM: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          # Strips at most one trailing newline and adds exactly one, so the file is the same
          # whether or not the secret was pasted with a final blank line.
          printf '%s\n' "${APPLE_API_KEY_PEM%$'\n'}" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # Shape only; nothing from the file is printed.
          grep -q -- "-----BEGIN PRIVATE KEY-----" "$KEY_PATH"
          grep -q -- "-----END PRIVATE KEY-----" "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Builds the .app and .dmg, signs with the Developer ID, notarises with the App Store
      # Connect credentials, staples the ticket, and — because bundle.createUpdaterArtifacts is
      # true — writes swarmz.app.tar.gz and its minisign .sig. In tauri-action v1 the
      # uploadUpdaterJson and uploadUpdaterSignatures inputs both default to true, so latest.json
      # and the .sig are generated and attached without asking. (v0 spells the first of those
      # includeUpdaterJson; the inputs used below exist in both.)
      #
      # APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID is tried FIRST by tauri-bundler 2.11.4's
      # notarize_auth, and an empty-but-set APPLE_ID would match it, so those two variables must
      # not appear here at all. APPLE_API_KEY holds the key *ID*, not the key: the key itself is
      # the file at APPLE_API_KEY_PATH, written above.
      #
      # APPLE_SIGNING_IDENTITY also reaches beforeBuildCommand, which is how `npm run build:tool`
      # knows to sign the holder binary (v0.2.0 was rejected because it was not).
      - name: Build, sign, notarise and draft the release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: swarmz ${{ github.ref_name }}
          releaseBody: "Write the notes here, then publish. Publishing is what makes the updater offer this version."
          releaseDraft: true
          prerelease: false
          # No --target: `npm run build:tool` puts swarmz-tool in src-tauri/target/release, which
          # is where bundle.macOS.files looks for it. A cross/universal build would need that
          # path to follow the triple too.
          args: ""

      # Runs even when the build failed, and even when the import step itself failed half way
      # through - hence recomputing the path rather than reading a variable that step might never
      # have exported. Nothing signing-related outlives the job.
      - name: Remove the signing keychain and the API key
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/swarmz-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" || true
          rm -rf "$RUNNER_TEMP/private_keys" || true

  # The phone app, attached to the same draft release. Independent of the desktop build except
  # for needing the release to exist first.
  android:
    needs: [checks, macos]
    if: github.repository == 'mokesmokane/swarmz'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The same guard as the macOS job: this job attaches an APK named after the version, and a
      # mismatch would name it something no release claims.
      - name: The tag must match the version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in src-tauri/tauri.conf.json ($VERSION). Run \`npm run version -- $TAG\`, commit, delete the tag and tag again."
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches version $VERSION"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The action's default package list is `tools platform-tools`, and `tools` is the obsolete
      # SDK package Google removed - sdkmanager exits 1 on it before Gradle ever runs. Pin what
      # the build actually needs instead: compileSdk 36 and the matching build-tools, the same
      # two the README tells a developer to install.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # The runner has no ~/.swarmz-android/signing.properties, so app/build.gradle.kts reads
      # these four variables instead (the local file still wins when it exists).
      - name: Write the keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and assemble
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/swarmz-$VERSION.apk"
          gh release upload "$TAG" "$RUNNER_TEMP/swarmz-$VERSION.apk" --clobber

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" || true
