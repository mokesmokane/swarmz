<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ row.onClick }}" onMouseEnter="{{ row.onEnter }}" onMouseLeave="{{ row.onLeave }}" title="{{ row.tip }}" style="position:relative;display:flex;align-items:flex-start;gap:8px;padding:5px 8px 5px {{ row.pad }};background:{{ row.bg }};box-shadow:{{ row.shadow }};opacity:{{ row.opacity }};cursor:default;user-select:none;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif">
  <sc-for list="{{ row.guides }}" as="g" hint-placeholder-count="0"><div style="position:absolute;top:0;bottom:0;left:{{ g.left }};width:1px;background:#2b2d33"></div></sc-for>
  <div style="position:absolute;left:0;top:0;bottom:0;width:2px;background:{{ row.edge }}"></div>
  <div onClick="{{ row.onCheck }}" style="width:14px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;position:relative">
    <sc-if value="{{ row.showCheck }}" hint-placeholder-val="{{ false }}"><div style="width:12px;height:12px;box-sizing:border-box;border-radius:3px;border:1.5px solid {{ row.checkBorder }};background:{{ row.checkBg }};display:flex;align-items:center;justify-content:center"><sc-if value="{{ row.selected }}"><svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="#fff" stroke-width="1.6"><path d="M1.2 4.2l1.8 1.8 3.8-4"></path></svg></sc-if></div></sc-if>
    <sc-if value="{{ row.showDot }}" hint-placeholder-val="{{ true }}"><div style="width:8px;height:8px;box-sizing:border-box;border-radius:50%;background:{{ row.dotBg }};border:1.5px solid {{ row.dotColor }};box-shadow:{{ row.dotRing }}"></div></sc-if>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
    <div style="display:flex;align-items:center;gap:5px;height:18px">
      <sc-if value="{{ row.hasCaret }}"><div onClick="{{ row.onFold }}" style="width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#8b8e95;margin-left:-3px;transform:{{ row.caretRot }}"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 3.8L5 6.3l2.5-2.5"></path></svg></div></sc-if>
      <sc-if value="{{ row.conductor }}"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="oklch(0.80 0.15 75)" stroke-width="1.4" style="flex:none"><circle cx="7" cy="3" r="1.8"></circle><circle cx="3" cy="11" r="1.8"></circle><circle cx="11" cy="11" r="1.8"></circle><path d="M7 4.8v2.2M7 7L3.9 9.4M7 7l3.1 2.4"></path></svg></sc-if>
      <div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:18px;color:{{ row.titleColor }};font-weight:{{ row.weight }};font-style:{{ row.titleStyle }}">{{ row.title }}</div>
      <sc-if value="{{ row.hideActions }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:6px;align-items:baseline;flex:none;font-size:11px"><span style="color:{{ row.statusColor }};font-weight:600">{{ row.status }}</span><span style="color:#6f727a;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px">{{ row.ago }}</span></div></sc-if>
      <sc-if value="{{ row.showActions }}"><div style="display:flex;gap:1px;flex:none;margin:-2px -4px -2px 0">
        <sc-if value="{{ row.canRole }}"><div onClick="{{ row.stop }}" title="Conductor role" style="width:22px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#a4a7ae" style-hover="background:#2e3137;color:#e8e9ec"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="3" r="1.8"></circle><circle cx="3" cy="11" r="1.8"></circle><circle cx="11" cy="11" r="1.8"></circle><path d="M7 4.8v2.2M7 7L3.9 9.4M7 7l3.1 2.4"></path></svg></div></sc-if>
        <sc-if value="{{ row.history }}"><div onClick="{{ row.stop }}" title="Previous sessions" style="width:22px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#a4a7ae" style-hover="background:#2e3137;color:#e8e9ec"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2"></path><path d="M2.3 1.8v2.4h2.4"></path><path d="M7 4.6V7l1.8 1.2"></path></svg></div></sc-if>
        <div onClick="{{ row.stop }}" title="Stop and remove" style="width:22px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#a4a7ae" style-hover="background:oklch(0.66 0.19 25 / 0.2);color:oklch(0.75 0.17 25)"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path></svg></div>
      </div></sc-if>
    </div>
    <div style="display:flex;align-items:center;gap:6px;height:16px;font-size:11px;color:#8b8e95">
      <div style="flex:none;min-width:14px;height:14px;padding:0 2px;box-sizing:border-box;border-radius:3px;background:{{ row.macColor }};color:#101114;font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ row.macMono }}</div>
      <div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ row.line2 }}</div>
      <sc-if value="{{ row.showSummary }}"><span style="flex:none;color:#8b8e95">{{ row.summary }}</span></sc-if>
      <sc-if value="{{ row.showSummaryNeeds }}"><span style="flex:none;color:oklch(0.80 0.15 75);font-weight:600">{{ row.summaryNeeds }}</span></sc-if>
      <sc-if value="{{ row.showName }}"><span style="flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:#7d8087">{{ row.name }}</span></sc-if>
      <sc-if value="{{ row.skip }}"><span title="Claude runs without permission prompts" style="flex:none;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;color:oklch(0.75 0.17 25);border:1px solid oklch(0.66 0.19 25 / 0.5);border-radius:3px;padding:0 3px;line-height:13px">no-prompt</span></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:44},&quot;row&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
